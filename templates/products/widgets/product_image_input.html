{# ProductImageInput: Django's clearable file input, restyled. The current image is previewed by the form template, not here. #}
<input type="{{ widget.type }}" name="{{ widget.name }}"{% include "django/forms/widgets/attrs.html" %}>
{% if widget.is_initial and not widget.required %}
  <label class="label mt-2 cursor-pointer justify-start gap-3" for="{{ widget.checkbox_id }}">
    <input type="checkbox" class="checkbox checkbox-sm" name="{{ widget.checkbox_name }}" id="{{ widget.checkbox_id }}"{% if widget.attrs.disabled %} disabled{% endif %}{% if widget.attrs.checked %} checked{% endif %}>
    <span>{{ widget.clear_checkbox_label }}</span>
  </label>
{% endif %}
